<svg width="2600" height="2650" viewBox="0 0 2600 2650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Execution Flow - Job Search Platform</title>
  <desc id="desc">Sequence-style execution flow for the job search platform, showing HTTP, Kafka topics, provider services, merger-service and Redis state.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11 Z" fill="#2563eb"/>
    </marker>

    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11 Z" fill="#7c3aed"/>
    </marker>

    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11 Z" fill="#059669"/>
    </marker>

    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11 Z" fill="#475569"/>
    </marker>

    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>

    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: url(#page-bg); }
    .title { font: 800 40px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #475569; }
    .lane-title { font: 800 15px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .lane-subtitle { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
    .section-title { font: 800 17px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .note-title { font: 800 14px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .note-line { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .message-text { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .footer { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }

    .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.4; filter: url(#shadow); }
    .lane { fill: #ffffff; stroke-width: 1.8; filter: url(#shadow); }
    .lane-blue { stroke: #2563eb; }
    .lane-teal { stroke: #0f766e; }
    .lane-purple { stroke: #7c3aed; }
    .lane-orange { stroke: #ea580c; }
    .lane-green { stroke: #059669; }
    .lane-slate { stroke: #64748b; }

    .stripe-blue { fill: #dbeafe; }
    .stripe-teal { fill: #ccfbf1; }
    .stripe-purple { fill: #ede9fe; }
    .stripe-orange { fill: #ffedd5; }
    .stripe-green { fill: #dcfce7; }
    .stripe-slate { fill: #e2e8f0; }

    .lifeline { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
    .arrow-blue { stroke: #2563eb; stroke-width: 2.6; fill: none; marker-end: url(#arrow-blue); }
    .arrow-purple { stroke: #7c3aed; stroke-width: 2.6; fill: none; marker-end: url(#arrow-purple); }
    .arrow-green { stroke: #059669; stroke-width: 2.6; fill: none; marker-end: url(#arrow-green); }
    .arrow-slate { stroke: #475569; stroke-width: 2.3; fill: none; marker-end: url(#arrow-slate); }
    .arrow-return { stroke: #64748b; stroke-width: 2.3; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-slate); }

    .label-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.1; }
    .label-bg-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.1; }
    .label-bg-purple { fill: #f5f3ff; stroke: #ddd6fe; stroke-width: 1.1; }
    .label-bg-green { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.1; }
    .label-bg-slate { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.1; }
    .rule { stroke: #e2e8f0; stroke-width: 1.2; }
  </style>

  <rect class="bg" width="2600" height="2650"/>

  <text class="title" x="1300" y="58" text-anchor="middle">Execution Flow - Job Search Platform</text>
  <text class="subtitle" x="1300" y="92" text-anchor="middle">HTTP starts the search, Kafka fans it out to providers, provider events update Redis as they arrive, and HTTP reads the result</text>

  <rect class="panel" x="52" y="124" width="2496" height="2380" rx="18"/>

  <!-- Lane headers -->
  <g transform="translate(80 156)">
    <rect class="lane lane-blue" width="210" height="74" rx="9"/>
    <rect class="stripe-blue" width="210" height="10" rx="5"/>
    <text class="lane-title" x="105" y="34" text-anchor="middle">Client</text>
    <text class="lane-subtitle" x="105" y="55" text-anchor="middle">Postman or UI</text>
  </g>

  <g transform="translate(375 156)">
    <rect class="lane lane-teal" width="240" height="74" rx="9"/>
    <rect class="stripe-teal" width="240" height="10" rx="5"/>
    <text class="lane-title" x="120" y="34" text-anchor="middle">search-service</text>
    <text class="lane-subtitle" x="120" y="55" text-anchor="middle">HTTP in, Kafka out, Redis read</text>
  </g>

  <g transform="translate(680 156)">
    <rect class="lane lane-purple" width="250" height="74" rx="9"/>
    <rect class="stripe-purple" width="250" height="10" rx="5"/>
    <text class="lane-title" x="125" y="34" text-anchor="middle">Kafka</text>
    <text class="lane-subtitle" x="125" y="55" text-anchor="middle">topic: search.requested.v1</text>
  </g>

  <g transform="translate(985 156)">
    <rect class="lane lane-orange" width="230" height="74" rx="9"/>
    <rect class="stripe-orange" width="230" height="10" rx="5"/>
    <text class="lane-title" x="115" y="34" text-anchor="middle">jobicy-service</text>
    <text class="lane-subtitle" x="115" y="55" text-anchor="middle">Jobicy HTTP JSON API</text>
  </g>

  <g transform="translate(1280 156)">
    <rect class="lane lane-green" width="250" height="74" rx="9"/>
    <rect class="stripe-green" width="250" height="10" rx="5"/>
    <text class="lane-title" x="125" y="34" text-anchor="middle">internal-jobs-service</text>
    <text class="lane-subtitle" x="125" y="55" text-anchor="middle">MongoDB internal_jobs</text>
  </g>

  <g transform="translate(1590 156)">
    <rect class="lane lane-slate" width="230" height="74" rx="9"/>
    <rect class="stripe-slate" width="230" height="10" rx="5"/>
    <text class="lane-title" x="115" y="34" text-anchor="middle">linkedin-service</text>
    <text class="lane-subtitle" x="115" y="55" text-anchor="middle">LinkedIn HTML, JSoup</text>
  </g>

  <g transform="translate(1880 156)">
    <rect class="lane lane-purple" width="260" height="74" rx="9"/>
    <rect class="stripe-purple" width="260" height="10" rx="5"/>
    <text class="lane-title" x="130" y="34" text-anchor="middle">Kafka</text>
    <text class="lane-subtitle" x="130" y="55" text-anchor="middle">provider results/failures</text>
  </g>

  <g transform="translate(2200 156)">
    <rect class="lane lane-teal" width="210" height="74" rx="9"/>
    <rect class="stripe-teal" width="210" height="10" rx="5"/>
    <text class="lane-title" x="105" y="34" text-anchor="middle">merger-service</text>
    <text class="lane-subtitle" x="105" y="55" text-anchor="middle">merge and status</text>
  </g>

  <g transform="translate(2440 156)">
    <rect class="lane lane-green" width="120" height="74" rx="9"/>
    <rect class="stripe-green" width="120" height="10" rx="5"/>
    <text class="lane-title" x="60" y="34" text-anchor="middle">Redis</text>
    <text class="lane-subtitle" x="60" y="55" text-anchor="middle">state</text>
  </g>

  <!-- Lifelines -->
  <line class="lifeline" x1="185" y1="250" x2="185" y2="2450"/>
  <line class="lifeline" x1="495" y1="250" x2="495" y2="2450"/>
  <line class="lifeline" x1="805" y1="250" x2="805" y2="2450"/>
  <line class="lifeline" x1="1100" y1="250" x2="1100" y2="2450"/>
  <line class="lifeline" x1="1405" y1="250" x2="1405" y2="2450"/>
  <line class="lifeline" x1="1705" y1="250" x2="1705" y2="2450"/>
  <line class="lifeline" x1="2010" y1="250" x2="2010" y2="2450"/>
  <line class="lifeline" x1="2305" y1="250" x2="2305" y2="2450"/>
  <line class="lifeline" x1="2500" y1="250" x2="2500" y2="2450"/>

  <!-- Section guide -->
  <text class="section-title" x="88" y="286">Start search</text>
  <line class="rule" x1="88" y1="304" x2="2512" y2="304"/>

  <!-- 1 -->
  <line class="arrow-blue" x1="185" y1="350" x2="495" y2="350"/>
  <rect class="label-bg-blue" x="240" y="320" width="205" height="25" rx="12"/>
  <text class="message-text" x="342" y="338" text-anchor="middle">POST /search</text>

  <!-- 2 -->
  <line class="arrow-purple" x1="495" y1="430" x2="805" y2="430"/>
  <rect class="label-bg-purple" x="545" y="400" width="210" height="25" rx="12"/>
  <text class="message-text" x="650" y="418" text-anchor="middle">SearchRequestedEvent</text>

  <text class="section-title" x="88" y="510">Kafka sends the request to providers</text>
  <line class="rule" x1="88" y1="528" x2="2512" y2="528"/>

  <!-- 3 -->
  <line class="arrow-purple" x1="805" y1="575" x2="1100" y2="575"/>
  <rect class="label-bg-purple" x="875" y="545" width="155" height="25" rx="12"/>
  <text class="message-text" x="952" y="563" text-anchor="middle">group: jobicy</text>

  <!-- 4 -->
  <line class="arrow-purple" x1="805" y1="655" x2="1405" y2="655"/>
  <rect class="label-bg-purple" x="985" y="625" width="240" height="25" rx="12"/>
  <text class="message-text" x="1105" y="643" text-anchor="middle">group: internal-jobs</text>

  <!-- 5 -->
  <line class="arrow-purple" x1="805" y1="735" x2="1705" y2="735"/>
  <rect class="label-bg-purple" x="1142" y="705" width="225" height="25" rx="12"/>
  <text class="message-text" x="1255" y="723" text-anchor="middle">group: linkedin</text>

  <text class="section-title" x="88" y="815">Provider events are processed as they arrive</text>
  <line class="rule" x1="88" y1="833" x2="2512" y2="833"/>

  <!-- 6 -->
  <line class="arrow-purple" x1="1100" y1="880" x2="2010" y2="880"/>
  <rect class="label-bg-purple" x="1418" y="850" width="274" height="25" rx="12"/>
  <text class="message-text" x="1555" y="868" text-anchor="middle">JOBICY result or failure event</text>

  <!-- 7 -->
  <line class="arrow-purple" x1="2010" y1="950" x2="2305" y2="950"/>
  <rect class="label-bg-purple" x="2055" y="920" width="205" height="25" rx="12"/>
  <text class="message-text" x="2158" y="938" text-anchor="middle">consume JOBICY event</text>

  <!-- 8 -->
  <line class="arrow-green" x1="2305" y1="1015" x2="2500" y2="1015"/>
  <rect class="label-bg-green" x="2324" y="985" width="158" height="25" rx="12"/>
  <text class="message-text" x="2403" y="1003" text-anchor="middle">load current state</text>

  <!-- 9 -->
  <line class="arrow-return" x1="2500" y1="1075" x2="2305" y2="1075"/>
  <rect class="label-bg-slate" x="2315" y="1045" width="175" height="25" rx="12"/>
  <text class="message-text" x="2402" y="1063" text-anchor="middle">current state or empty</text>

  <rect class="label-bg-slate" x="2172" y="1125" width="266" height="25" rx="12"/>
  <text class="message-text" x="2305" y="1143" text-anchor="middle">merge jobs + calculate status</text>

  <!-- 10 -->
  <line class="arrow-green" x1="2305" y1="1185" x2="2500" y2="1185"/>
  <rect class="label-bg-green" x="2322" y="1155" width="160" height="25" rx="12"/>
  <text class="message-text" x="2402" y="1173" text-anchor="middle">save updated state</text>

  <!-- 11 -->
  <line class="arrow-purple" x1="1405" y1="1290" x2="2010" y2="1290"/>
  <rect class="label-bg-purple" x="1562" y="1260" width="292" height="25" rx="12"/>
  <text class="message-text" x="1708" y="1278" text-anchor="middle">INTERNAL result or failure event</text>

  <!-- 12 -->
  <line class="arrow-purple" x1="2010" y1="1360" x2="2305" y2="1360"/>
  <rect class="label-bg-purple" x="2048" y="1330" width="220" height="25" rx="12"/>
  <text class="message-text" x="2158" y="1348" text-anchor="middle">consume INTERNAL event</text>

  <!-- 13 -->
  <line class="arrow-green" x1="2305" y1="1425" x2="2500" y2="1425"/>
  <rect class="label-bg-green" x="2324" y="1395" width="158" height="25" rx="12"/>
  <text class="message-text" x="2403" y="1413" text-anchor="middle">load current state</text>

  <!-- 14 -->
  <line class="arrow-return" x1="2500" y1="1485" x2="2305" y2="1485"/>
  <rect class="label-bg-slate" x="2315" y="1455" width="175" height="25" rx="12"/>
  <text class="message-text" x="2402" y="1473" text-anchor="middle">current state</text>

  <rect class="label-bg-slate" x="2172" y="1535" width="266" height="25" rx="12"/>
  <text class="message-text" x="2305" y="1553" text-anchor="middle">merge jobs + calculate status</text>

  <!-- 15 -->
  <line class="arrow-green" x1="2305" y1="1595" x2="2500" y2="1595"/>
  <rect class="label-bg-green" x="2322" y="1565" width="160" height="25" rx="12"/>
  <text class="message-text" x="2402" y="1583" text-anchor="middle">save updated state</text>

  <!-- 16 -->
  <line class="arrow-purple" x1="1705" y1="1700" x2="2010" y2="1700"/>
  <rect class="label-bg-purple" x="1748" y="1670" width="220" height="25" rx="12"/>
  <text class="message-text" x="1858" y="1688" text-anchor="middle">LINKEDIN result/failure</text>

  <!-- 17 -->
  <line class="arrow-purple" x1="2010" y1="1770" x2="2305" y2="1770"/>
  <rect class="label-bg-purple" x="2048" y="1740" width="220" height="25" rx="12"/>
  <text class="message-text" x="2158" y="1758" text-anchor="middle">consume LINKEDIN event</text>

  <!-- 18 -->
  <line class="arrow-green" x1="2305" y1="1835" x2="2500" y2="1835"/>
  <rect class="label-bg-green" x="2324" y="1805" width="158" height="25" rx="12"/>
  <text class="message-text" x="2403" y="1823" text-anchor="middle">load current state</text>

  <!-- 19 -->
  <line class="arrow-return" x1="2500" y1="1895" x2="2305" y2="1895"/>
  <rect class="label-bg-slate" x="2315" y="1865" width="175" height="25" rx="12"/>
  <text class="message-text" x="2402" y="1883" text-anchor="middle">current state</text>

  <rect class="label-bg-slate" x="2172" y="1945" width="266" height="25" rx="12"/>
  <text class="message-text" x="2305" y="1963" text-anchor="middle">merge jobs + calculate status</text>

  <!-- 20 -->
  <line class="arrow-green" x1="2305" y1="2005" x2="2500" y2="2005"/>
  <rect class="label-bg-green" x="2322" y="1975" width="160" height="25" rx="12"/>
  <text class="message-text" x="2402" y="1993" text-anchor="middle">save updated state</text>

  <text class="section-title" x="88" y="2130">Read materialized search state</text>
  <line class="rule" x1="88" y1="2148" x2="2512" y2="2148"/>

  <!-- 21 -->
  <line class="arrow-blue" x1="185" y1="2200" x2="495" y2="2200"/>
  <rect class="label-bg-blue" x="220" y="2170" width="240" height="25" rx="12"/>
  <text class="message-text" x="340" y="2188" text-anchor="middle">GET /search/{searchId}</text>

  <!-- 22 -->
  <line class="arrow-green" x1="495" y1="2275" x2="2500" y2="2275"/>
  <rect class="label-bg-green" x="1315" y="2245" width="365" height="25" rx="12"/>
  <text class="message-text" x="1498" y="2263" text-anchor="middle">load SearchState from search:{searchId}</text>

  <!-- 23 -->
  <line class="arrow-return" x1="2500" y1="2345" x2="495" y2="2345"/>
  <rect class="label-bg-slate" x="1350" y="2315" width="295" height="25" rx="12"/>
  <text class="message-text" x="1498" y="2333" text-anchor="middle">SearchState JSON or empty</text>

  <!-- 24 -->
  <path class="arrow-return" d="M495 2410 H185"/>
  <rect class="label-bg-slate" x="238" y="2380" width="205" height="25" rx="12"/>
  <text class="message-text" x="340" y="2398" text-anchor="middle">200 OK or 404</text>

  <!-- Notes -->
  <g transform="translate(1040 254)">
    <rect class="label-bg-slate" width="520" height="118" rx="12"/>
    <text class="note-title" x="260" y="28" text-anchor="middle">Core rule</text>
    <text class="note-line" x="260" y="55" text-anchor="middle">All related Kafka messages use searchId as key.</text>
    <text class="note-line" x="260" y="80" text-anchor="middle">Each provider has a different consumer group.</text>
    <text class="note-line" x="260" y="105" text-anchor="middle">That is why every provider receives the same search event.</text>
  </g>

  <g transform="translate(2100 300)">
    <rect class="label-bg-green" width="395" height="150" rx="12"/>
    <text class="note-title" x="198" y="30" text-anchor="middle">SearchStatus</text>
    <text class="note-line" x="198" y="58" text-anchor="middle">All completed: COMPLETED</text>
    <text class="note-line" x="198" y="83" text-anchor="middle">Some failed: COMPLETED_WITH_FAILURES</text>
    <text class="note-line" x="198" y="108" text-anchor="middle">All failed: FAILED</text>
    <text class="note-line" x="198" y="133" text-anchor="middle">Any pending: PENDING</text>
  </g>

  <text class="footer" x="88" y="2595">Clean Architecture: adapter in - application - port out - adapter out</text>
  <text class="footer" x="2512" y="2595" text-anchor="end">Java 21 - Spring Boot - Apache Kafka - Redis - MongoDB - Docker Compose</text>
</svg>
