services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: job-search-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: job-search-kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  redis:
    image: redis:8.0.3
    container_name: job-search-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  redis-insight:
    image: redis/redisinsight:2.70
    container_name: job-search-redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis

  mongodb:
    image: mongo:8.0.28
    container_name: job-search-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: job-search-mongo-express
    ports:
      - "8086:8081"
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH_ENABLED: "false"

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: job-search-search-service
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - redis
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_URL: redis://redis:6379

  merger-service:
    build:
      context: ./merger-service
      dockerfile: Dockerfile
    container_name: job-search-merger-service
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - redis
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_URL: redis://redis:6379

  jobicy-service:
    build:
      context: ./jobicy-service
      dockerfile: Dockerfile
    container_name: job-search-jobicy-service
    ports:
      - "8082:8082"
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JOBICY_BASE_URL: https://jobicy.com

  internal-jobs-service:
    build:
      context: ./internal-jobs-service
      dockerfile: Dockerfile
    container_name: job-search-internal-jobs-service
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - mongodb
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/job-search-platform

  linkedin-service:
    build:
      context: ./linkedin-service
      dockerfile: Dockerfile
    container_name: job-search-linkedin-service
    ports:
      - "8087:8087"
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_LINKEDIN_BASE_URL: https://www.linkedin.com

volumes:
  redis-data:
  redis-insight-data:
  mongodb-data: